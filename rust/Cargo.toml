[package]
name = "lp2ln-android-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "lp2ln_android"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.21"
lp2ln-core-v2 = { git = "https://github.com/krusalovorg/lp2ln.git", rev = "65925aaf9b8faabfba4f9eaf607ac5eb8860e0cc" }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
async-trait = "0.1"

[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
