[package]
name = "lp2ln-android-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "lp2ln_android"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.21"
lp2ln-core-v2 = { git = "https://github.com/krusalovorg/lp2ln.git", rev = "4332b153210090d252baf3a2e19259967fc885da" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }

[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
